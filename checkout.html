<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Fima</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            color: #111;
        }

        header {
            background-color: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        header a:hover {
            text-decoration: underline;
        }

        .checkout {
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        .checkout h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #111;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .total {
            margin-top: 30px;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-size: 22px;
            font-weight: bold;
            text-align: right;
        }

        .place-order {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .place-order:hover {
            background-color: #444;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
        }

        .shop-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #111;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .shop-button:hover {
            background-color: #444;
        }

        @media (max-width: 600px) {

            .checkout {
                margin: 20px;
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Fima Checkout
    </h1>

    <div style="margin-top: 10px;">

        <a href="index.html">
            Home
        </a>

        &nbsp; | &nbsp;

        <a href="cart.html">
            Cart 🛒
            (<span id="cart-count">0</span>)
        </a>

        &nbsp; | &nbsp;

        <a href="login.html">
            Login
        </a>

    </div>

</header>



<div
    class="checkout"
    id="checkout-container"
>

    <h2>
        Delivery Information
    </h2>


    <form id="checkout-form">


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your full address"
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >

        </div>


        <div class="form-group">

            <label for="state">
                State
            </label>

            <input
                type="text"
                id="state"
                placeholder="Enter your state"
                required
            >

        </div>


        <div class="form-group">

            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter your pincode"
                required
            >

        </div>


        <div class="form-group">

            <label for="payment">
                Payment Method
            </label>

            <select
                id="payment"
                required
            >

                <option value="">
                    Select Payment Method
                </option>

                <option value="cod">
                    Cash on Delivery
                </option>

                <option value="online">
                    Online Payment
                </option>

            </select>

        </div>


        <div class="total">

            Total:
            ₹<span id="grand-total">0</span>

        </div>


        <button
            type="submit"
            class="place-order"
        >
            Place Order
        </button>


    </form>


    <a
        href="cart.html"
        class="back"
    >
        ← Back to Cart
    </a>


</div>



<script>


/* =====================================
   PRODUCT PRICES
===================================== */

const products = {

    1: 500,
    2: 750,
    3: 1000,
    4: 600,
    5: 850,
    6: 900,
    7: 1200

};



/* =====================================
   GET CART
===================================== */

function getCart() {

    const savedCart =
        localStorage.getItem("fimaCart");

    if (!savedCart) {
        return {};
    }

    try {

        return JSON.parse(savedCart);

    } catch (error) {

        return {};

    }

}



/* =====================================
   UPDATE CART COUNTER
===================================== */

function updateCartCount() {

    const cart = getCart();

    let count = 0;


    Object.values(cart).forEach(function(quantity) {

        count += Number(quantity);

    });


    const cartCount =
        document.getElementById("cart-count");


    if (cartCount) {

        cartCount.textContent = count;

    }

}



/* =====================================
   CALCULATE TOTAL
===================================== */

function calculateTotal() {

    const cart = getCart();

    let total = 0;


    Object.keys(cart).forEach(function(id) {

        if (products[id]) {

            total +=
                products[id] *
                Number(cart[id]);

        }

    });


    return total;

}



/* =====================================
   GET TOTAL
===================================== */

const grandTotal =
    calculateTotal();


document.getElementById(
    "grand-total"
).textContent = grandTotal;



/* =====================================
   CHECK EMPTY CART
===================================== */

const cart = getCart();

const cartItems =
    Object.keys(cart);


if (cartItems.length === 0) {

    document.getElementById(
        "checkout-container"
    ).innerHTML = `

        <div class="empty-message">

            <h2>
                Your Cart Is Empty
            </h2>

            <p>
                Please add some products
                before checking out.
            </p>

            <a
                href="index.html"
                class="shop-button"
            >
                Continue Shopping
            </a>

        </div>

    `;

}



/* =====================================
   CHECKOUT FORM
===================================== */

const checkoutForm =
    document.getElementById(
        "checkout-form"
    );


if (checkoutForm) {

    checkoutForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            /* =============================
               CUSTOMER INFORMATION
            ============================= */

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const address =
                document
                    .getElementById("address")
                    .value
                    .trim();


            const city =
                document
                    .getElementById("city")
                    .value
                    .trim();


            const state =
                document
                    .getElementById("state")
                    .value
                    .trim();


            const pincode =
                document
                    .getElementById("pincode")
                    .value
                    .trim();


            const payment =
                document
                    .getElementById("payment")
                    .value;



            /* =============================
               CREATE ORDER
            ============================= */

            const order = {

                name: name,

                phone: phone,

                address: address,

                city: city,

                state: state,

                pincode: pincode,

                payment: payment,

                total: grandTotal,

                date:
                    new Date().toISOString()

            };



            /* =============================
               SAVE ORDER
            ============================= */

            localStorage.setItem(
                "fimaOrder",
                JSON.stringify(order)
            );



            /* =============================
               CLEAR CART
            ============================= */

            localStorage.removeItem(
                "fimaCart"
            );



            /* =============================
               GO TO SUCCESS PAGE
            ============================= */

            window.location.href =
                "order_success.html";

        }
    );

}



/* =====================================
   START CART COUNTER
===================================== */

updateCartCount();


</script>


</body>

</html>
