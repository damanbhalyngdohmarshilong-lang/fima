<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fima - Online Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #111;
        }


        /* HEADER */

        header {
            background-color: #111;
            color: white;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #ccc;
        }


        /* HERO */

        .hero {
            text-align: center;
            padding: 70px 20px;
            background-color: white;
        }

        .hero h2 {
            font-size: 40px;
            margin: 0 0 15px;
        }

        .hero p {
            font-size: 18px;
            color: #666;
        }


        /* PRODUCTS */

        .products {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 30px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }


        /* PRODUCT CARD */

        .product-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }


        /* ADD TO CART BUTTON */

        .add-cart {
            width: 100%;
            padding: 12px;

            background-color: #111;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 15px;
            cursor: pointer;
        }

        .add-cart:hover {
            background-color: #444;
        }


        /* FOOTER */

        footer {
            margin-top: 60px;
            background-color: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {

            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h2 {
                font-size: 30px;
            }

            .product-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<!-- JAVASCRIPT -->

<script>

    function addToCart(productId) {

        // Get existing cart
        let cart =
            JSON.parse(
                localStorage.getItem("fimaCart")
            ) || {};

        // Add product
        if (cart[productId]) {

            cart[productId]++;

        } else {

            cart[productId] = 1;

        }

        // Save cart
        localStorage.setItem(
            "fimaCart",
            JSON.stringify(cart)
        );

        // Automatically open the cart
        window.location.href = "cart.html";

    }
