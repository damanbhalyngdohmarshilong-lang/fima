<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Fima</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #111;
        }


        /* HEADER */

        header {
            background-color: #111;
            color: white;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ccc;
        }


        /* LOGIN BOX */

        .login-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 35px;

            background-color: white;

            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .login-container h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #111;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;
            padding: 13px;

            background-color: #111;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #444;
        }


        /* MESSAGE */

        .message {
            margin-top: 20px;
            padding: 12px;

            border-radius: 5px;

            text-align: center;

            display: none;
        }

        .message.success {
            display: block;
            background-color: #e7f7eb;
            color: #168a35;
        }

        .message.error {
            display: block;
            background-color: #fdeaea;
            color: #c00;
        }


        /* LINKS */

        .links {
            margin-top: 25px;
            text-align: center;
        }

        .links a {
            color: #111;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav a {
                margin: 0 8px;
            }

            .login-container {
                margin: 40px 20px;
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>Fima</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

    </nav>

</header>



<!-- LOGIN -->

<div class="login-container">

    <h2>
        Login to Fima
    </h2>


    <form id="login-form">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="links">

        <a href="index.html">
            ← Continue Shopping
        </a>

    </div>

</div>



<script>

document
    .getElementById("login-form")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();


        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("message");


        /*
         * Demo login only.
         *
         * We deliberately do NOT save the password.
         */

        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            message.className =
                "message error";

            return;

        }


        /*
         * Remember that the visitor
         * has logged in.
         */

        localStorage.setItem(
            "fimaLoggedIn",
            "true"
        );


        localStorage.setItem(
            "fimaUserEmail",
            email
        );


        message.textContent =
            "Login successful!";


        message.className =
            "message success";


        /*
         * Go back to homepage
         * after a short delay.
         */

        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 1000);

    });

</script>


</body>

</html>
